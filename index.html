<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Полевой журнал — Pet Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#F2EEE3;
  --paper-2:#EAE4D4;
  --card:#FCFAF3;
  --ink:#22301F;
  --ink-soft:#5B6B54;
  --line:#DAD3BE;
  --moss:#4B6B4A;
  --moss-dark:#374F37;
  --moss-tint:#E4EBDF;
  --clay:#B5592E;
  --clay-tint:#F5E4D9;
  --gold:#B9872B;
  --gold-tint:#F3E7C9;
  --sky:#3E6B7C;
  --sky-tint:#DEE9EC;
  --red:#A5433A;
  --red-tint:#F4DEDA;
  --purple:#7A5AA8;
  --purple-tint:#E9E2F3;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(34,48,31,0.06), 0 6px 20px -8px rgba(34,48,31,0.15);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D2C9AC;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* layout */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:216px;flex-shrink:0;background:var(--paper-2);
  border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px 8px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--moss);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:17px;height:17px;stroke:var(--paper);}
.brand-text{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;line-height:1.15;}
.brand-text small{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:var(--ink-soft);font-weight:500;font-size:13.5px;border:none;background:transparent;text-align:left;width:100%;
  transition:background .12s, color .12s;
}
.nav-item svg{width:16px;height:16px;stroke:currentColor;flex-shrink:0;}
.nav-item:hover{background:#E1DBC6;color:var(--ink);}
.nav-item.active{background:var(--moss);color:#fff;}
.nav-item .badge{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}
.nav-item.active .badge{background:rgba(255,255,255,.25);}
.nav-sep{height:1px;background:var(--line);margin:10px 4px;}
.sidebar-foot{margin-top:auto;padding-top:10px;}
.user-switch{display:flex;gap:6px;padding:8px;background:var(--card);border-radius:10px;border:1px solid var(--line);}
.user-pill{flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);}
.user-pill.active{background:var(--moss);color:#fff;}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);padding:6px 8px 2px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--moss);flex-shrink:0;}
.sync-dot.off{background:var(--red);}
.sync-dot.pending{background:var(--gold);}

.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;}
.page-title{font-size:26px;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
.search-box{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:260px;}
.search-box svg{width:15px;height:15px;stroke:var(--ink-soft);flex-shrink:0;}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink);font-family:inherit;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;}
.btn:hover{border-color:var(--moss);}
.btn svg{width:14px;height:14px;stroke:currentColor;}
.btn-primary{background:var(--moss);border-color:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-dark);}
.btn-clay{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;padding:6px 8px;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-danger{color:var(--red);}
.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}

.grid{display:grid;gap:16px;}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(228px,1fr));}
.grid-2{grid-template-columns:1.3fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title h3{font-size:15px;}
.card-title .count{color:var(--ink-soft);font-size:12px;}

.section-block{margin-bottom:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-head h2{font-size:17px;}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}

/* pet card */
.pet-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;}
.pet-card:hover{transform:translateY(-2px);}
.pet-photo{height:118px;background:linear-gradient(135deg,var(--moss-tint),var(--sky-tint));display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;}
.pet-photo img{width:100%;height:100%;object-fit:cover;}
.status-chip{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.85);}
.pet-info{padding:12px 14px 14px;}
.pet-info .name{font-family:'Fraunces';font-weight:600;font-size:16px;}
.pet-info .meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.pet-info .stats-row{display:flex;gap:12px;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
.pet-info .stats-row b{color:var(--ink);font-family:'IBM Plex Mono';font-weight:600;}

/* list rows */
.list-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-moss{background:var(--moss);} .dot-clay{background:var(--clay);} .dot-gold{background:var(--gold);} .dot-sky{background:var(--sky);} .dot-red{background:var(--red);} .dot-purple{background:var(--purple);}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:13px;}
.row-sub{color:var(--ink-soft);font-size:11.5px;margin-top:1px;}
.row-right{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-family:'IBM Plex Mono';}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill-clay{background:var(--clay-tint);color:var(--clay);}
.pill-moss{background:var(--moss-tint);color:var(--moss-dark);}
.pill-gold{background:var(--gold-tint);color:var(--gold);}
.pill-sky{background:var(--sky-tint);color:var(--sky);}
.pill-red{background:var(--red-tint);color:var(--red);}
.pill-purple{background:var(--purple-tint);color:var(--purple);}
.empty-note{color:var(--ink-soft);font-size:12.5px;padding:10px 2px;}

/* progress */
.progress-track{height:8px;background:var(--paper-2);border-radius:20px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:20px;background:var(--moss);}

/* tabs */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tabbtn{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:transparent;border:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--moss-dark);border-bottom-color:var(--moss);}

/* forms & modal */
.overlay{position:fixed;inset:0;background:rgba(34,48,31,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;padding:22px 24px 24px;box-shadow:0 20px 60px -12px rgba(0,0,0,.35);}
.modal h3{font-size:17px;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--moss);}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:10px;}
.field-row>*{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-soft);}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-day{min-height:78px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card);font-size:11px;position:relative;cursor:pointer;}
.cal-day.other{opacity:.35;}
.cal-day.today{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss);}
.cal-day .num{font-family:'IBM Plex Mono';font-weight:600;font-size:11.5px;}
.cal-evt{margin-top:3px;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);animation:toastin .15s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.warn-banner{display:flex;gap:10px;align-items:flex-start;background:var(--red-tint);border:1px solid #E3B5AC;color:var(--red);padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:10px;}
.warn-banner svg{width:15px;height:15px;stroke:var(--red);flex-shrink:0;margin-top:1px;}

.timeline{position:relative;padding-left:20px;}
.timeline:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line);border-left:2px dashed var(--line);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:before{content:'';position:absolute;left:-19px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--moss);border:2px solid var(--card);}
.tl-date{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}
.tl-title{font-weight:600;font-size:13px;margin-top:1px;}
.tl-sub{font-size:11.5px;color:var(--ink-soft);}

.stat-big{font-family:'IBM Plex Mono';font-weight:600;font-size:24px;}
.stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.two-col-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.icon-btn{background:none;border:none;padding:5px;border-radius:6px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--paper-2);color:var(--ink);}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;}

.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-opt{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
.chip-opt.active{background:var(--moss);border-color:var(--moss);color:#fff;}

.photo-pick{display:flex;align-items:center;gap:10px;}
.photo-pick .preview{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--paper-2);flex-shrink:0;}

@media print{
  .sidebar,.topbar,.quickbar,.tabbar,.no-print{display:none !important;}
  body{background:#fff;}
  .main{max-width:100%;padding:0;}
}
@media(max-width:760px){
  .sidebar{position:fixed;left:-230px;transition:left .2s;z-index:150;}
  .sidebar.open{left:0;}
  .main{padding:16px;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .search-box{width:150px;}
}
</style>
</head>

<script>
/* ============ ICONS ============ */

  syringe:'<path d="M13 3l4 4-2 2-4-4 2-2Z"/><path d="M13.5 5.5 6 13v3H3v-3l7.5-7.5"/><path d="M9 9l2 2M7 11l2 2"/>',

};
function icon(name){return `<svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDOQSPrLXSf7hpwwieChBzXvQwGaqD0PpI",
  authDomain: "saver-money.firebaseapp.com",
  databaseURL: "https://saver-money-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "saver-money",
  storageBucket: "saver-money.firebasestorage.app",
  messagingSenderId: "557752945402",
  appId: "1:557752945402:web:240da5cad31c9bfea11743",
  measurementId: "G-0X8BMC1635"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const petDashRef = db.ref('petDashboard/data');
const expensesRef = db.ref('budget/animalExpenses');
const fundsRef = db.ref('petFunds');
let syncState = 'pending'; // pending | ok | off

/* ============ STATE ============ */
let state = null;
let saveTimer = null;
let pendingWrite = false; // true while a local save is queued or in-flight
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = ()=> new Date().toISOString().slice(0,10);
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMoney(n){ return (Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+' €'; }
function monthNameRu(date){
  const d = date||new Date();
  const s = d.toLocaleDateString('ru-RU',{month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function pluralRu(n,f1,f2,f5){
  n = Math.abs(n)%100;
  const n1 = n%10;
  if(n>10 && n<20) return f5;
  if(n1>1 && n1<5) return f2;
  if(n1===1) return f1;
  return f5;
}
function ageStr(dob){
  if(!dob) return '—';
  const birth = new Date(dob+'T00:00:00');
  const now = new Date();
  if(isNaN(birth)) return '—';
  let years = now.getFullYear()-birth.getFullYear();
  let months = now.getMonth()-birth.getMonth();
  if(now.getDate()<birth.getDate()) months--;
  if(months<0){ years--; months+=12; }
  if(years<0) years=0;
  const parts = [];
  if(years>0) parts.push(years+' '+pluralRu(years,'год','года','лет'));
  if(months>0 || years===0) parts.push(months+' '+pluralRu(months,'месяц','месяца','месяцев'));
  return parts.join(' ') || 'меньше месяца';
}
function resizeImageFile(file, maxSize=360, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height){ if(width>maxSize){ height = Math.round(height*maxSize/width); width = maxSize; } }
        else { if(height>maxSize){ width = Math.round(width*maxSize/height); height = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* helpers to keep budget/animalExpenses and petFunds as clean 0..n arrays,
   matching the structure already used by the "Наш Бюджет" site */
function arrFromSnapshot(snap){
  const v = snap.val();
  if(!v) return [];
  return Array.isArray(v) ? v.filter(x=>x!=null) : Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]);
}
function nextArrId(arr){
  return arr.reduce((m,x)=> Math.max(m, Number(x?.id)||0), 0) + 1;
}
async function pushToArrayRef(ref, item){
  const snap = await ref.once('value');
  const arr = arrFromSnapshot(snap);
  item.id = nextArrId(arr);
  arr.push(item);
  await ref.set(arr);
  return item;
}
async function updateArrayItem(ref, matchId, patch){
  const snap = await ref.once('value');
  const arr = arrFromSnapshot(snap);
  const idx = arr.findIndex(x=>Number(x.id)===Number(matchId));
  if(idx===-1) return;
  arr[idx] = {...arr[idx], ...patch};
  await ref.set(arr);
}
async function removeArrayItem(ref, matchId){
  const snap = await ref.once('value');
  const arr = arrFromSnapshot(snap).filter(x=>Number(x.id)!==Number(matchId));
  await ref.set(arr);
}

const DEFAULT_STATE = ()=>({
  pets:[],
  weightLogs:[],
  healthEvents:[],
  vetVisits:[],
  documents:[],
  expenses:[],
  savings:[],
  events:[],
  supplies:[],
  reminderSettings:{offsets:[30,14,7,3,1]},
  currentUser:'Кристина',
  archive:[]
});

async function loadState(){
  state = DEFAULT_STATE();
  try{
    const snap = await petDashRef.once('value');
    const remote = snap.val();
    if(remote){
      Object.assign(state, remote, {expenses: state.expenses, savings: state.savings});
    }
    // NOTE: intentionally NOT auto-writing default/demo data to Firebase when
    // remote is empty. Auto-writing here was clobbering real data on other
    // devices whenever a read raced ahead of the real data (or the app was
    // opened before the real database finished loading), and it re-seeded
    // fake demo pets/vaccinations that nobody actually created.
    syncState = 'ok';
  }catch(e){
    console.error('load failed', e); syncState='off';
  }
  migrateAndRoll();

  // live updates from other devices/users for the pet-dashboard's own data
  petDashRef.on('value', snap=>{
    // While we have a local change queued/in-flight, ignore incoming echoes.
    // Otherwise a remote snapshot that predates our own edit can silently
    // overwrite (undo) a delete/edit made a moment ago, before our own
    // write has landed - this is what caused "deleted items reappear" and
    // "different data on different devices".
    if(pendingWrite) return;
    const remote = snap.val();
    if(!remote) return;
    Object.assign(state, remote, {expenses: state.expenses, savings: state.savings});
    migrateAndRoll();
    render();
  });

  // live sync with the shared budget app: расходы «Животные»
  expensesRef.on('value', snap=>{
    const arr = arrFromSnapshot(snap);
    state.expenses = arr.map(e=>({
      id: e.id, petId: e.petId || null, date: e.date, amount: Number(e.amount)||0,
      category: e.cat || e.category || 'другое', comment: e.comment || '', pay: e.pay || 'cash'
    }));
    render();
  });

  // live sync with the shared budget app: копилки «Фонд животных» (petFunds)
  // real schema: color, currentSaved, cycleDays, emoji, id, lastPurchaseDate,
  // linkedPlanId, monthlyAmount, name, purchaseHistory, totalCost
  fundsRef.on('value', snap=>{
    const arr = arrFromSnapshot(snap);
    state.savings = arr.map(f=>({
      id: f.id, name: f.name || 'Без названия',
      current: Number(f.currentSaved)||0,
      monthly: Number(f.monthlyAmount)||0,
      cycleDays: f.cycleDays||null,
      goal: Number(f.totalCost)>0 ? Number(f.totalCost) : null,
      totalCost: Number(f.totalCost)||0,
      emoji: f.emoji, color: f.color,
      lastPurchaseDate: f.lastPurchaseDate||null,
      linkedPlanId: f.linkedPlanId||null,
      history: f.purchaseHistory||[]
    }));
    render();
  });

  db.ref('.info/connected').on('value', snap=>{
    syncState = snap.val()? 'ok':'off';
    const dot = document.getElementById('syncDot'); const label = document.getElementById('syncLabel');
    if(dot){ dot.className = 'sync-dot '+(syncState==='ok'?'':'off'); }
    if(label){ label.textContent = syncState==='ok' ? 'Синхронизировано' : 'Нет связи'; }
  });
}
function scheduleSave(){
  clearTimeout(saveTimer);
  pendingWrite = true;
  const dot = document.getElementById('syncDot'); if(dot) dot.className='sync-dot pending';
  saveTimer = setTimeout(()=>persist(), 500);
}
async function persist(){
  try{
    const {expenses, savings, ...rest} = state; // expenses/savings live in the shared budget nodes, not here
    await petDashRef.set(rest);
    syncState = 'ok';
  }
  catch(e){ console.error('save failed', e); syncState='off'; toast('Не удалось сохранить данные — проверьте связь'); }
  finally{
    pendingWrite = false; // only now is it safe to accept remote echoes again
  }
  const dot = document.getElementById('syncDot'); const label = document.getElementById('syncLabel');
  if(dot){ dot.className = 'sync-dot '+(syncState==='ok'?'':'off'); }
  if(label){ label.textContent = syncState==='ok' ? 'Синхронизировано' : 'Нет связи'; }
}
function migrateAndRoll(){
  // roll forward recurring calendar events that are past due
  const today = todayISO();
  let changed=false;
  state.events.forEach(ev=>{
    if(!ev.done && ev.repeatEveryDays && ev.date < today){
      let d = ev.date;
      while(d < today){ d = addDays(d, ev.repeatEveryDays); }
      ev.date = d;
      changed=true;
    }
  });
  if(changed) scheduleSave();
}
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

/* ============ DERIVED / REMINDERS ============ */
function activePets(){ return state.pets.filter(p=>!state.archive.includes(p.id)); }
function petById(id){ return state.pets.find(p=>p.id===id); }

function upcomingItems(){
  // merge calendar events + health event next-dates + vet visits planned
  const items = [];
  state.events.filter(e=>!e.done).forEach(e=>{
    items.push({date:e.date, title:e.title, type:e.type, petId:e.petId, source:'event', id:e.id});
  });
  state.healthEvents.forEach(h=>{
    if(h.nextDate){
      items.push({date:h.nextDate, title:(h.type==='обработка'?'Обработка':(h.type==='вакцинация'?'Прививка':h.title))+' — '+(petById(h.petId)?.name||''), type:h.type, petId:h.petId, source:'health', id:h.id});
    }
  });
  state.vetVisits.filter(v=>v.date>=todayISO()).forEach(v=>{
    items.push({date:v.date, title:'Визит к ветеринару — '+(petById(v.petId)?.name||''), type:'ветеринар', petId:v.petId, source:'vet', id:v.id});
  });
  // dedupe similar same-day+title
  const seen = new Set();
  const uniq = items.filter(it=>{ const k=it.date+it.title; if(seen.has(k)) return false; seen.add(k); return true; });
  return uniq.sort((a,b)=> a.date.localeCompare(b.date));
}
function urgencyDot(days){
  if(days<=1) return 'dot-red';
  if(days<=3) return 'dot-clay';
  if(days<=7) return 'dot-gold';
  return 'dot-moss';
}
function typeDot(type){
  if(type==='обработка') return 'dot-clay';
  if(type==='вакцинация') return 'dot-moss';
  if(type==='ветеринар') return 'dot-sky';
  if(type==='день_рождения') return 'dot-purple';
  return 'dot-gold';
}

function lowSupplies(){
  return state.supplies.map(s=>{
    const daysLeft = s.avgConsumption>0 ? Math.floor(s.currentStock/s.avgConsumption) : 999;
    return {...s, daysLeft};
  }).sort((a,b)=>a.daysLeft-b.daysLeft);
}
function supplyTargetLabel(petId){
  if(petId==='all') return 'Все животные';
  if(petId==='group:dogs') return 'Собаки';
  if(petId==='group:cats') return 'Кошки';
  if(petId==='group:kittens') return 'Котята';
  return petById(petId)?.name || '—';
}
function monthExpenses(petId=null){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  return state.expenses.filter(e=>{
    if(!e.date) return false;
    const d = new Date(e.date+'T00:00:00');
    if(isNaN(d)) return false;
    return d.getFullYear()===y && d.getMonth()===m && (!petId || e.petId===petId);
  }).reduce((s,e)=>s+(Number(e.amount)||0),0);
}
function periodExpenses(days,petId=null){
  const cutoff = addDays(todayISO(), -days);
  return state.expenses.filter(e=> e.date>=cutoff && (!petId || e.petId===petId));
}

function buildWarnings(){

function petWeight(p){
  const logs = state.weightLogs.filter(w=>w.petId===p.id).sort((a,b)=>a.date.localeCompare(b.date));
  const last = logs[logs.length-1];
  const prev = logs[logs.length-2];
  const change = (last && prev) ? +(last.weight-prev.weight).toFixed(2) : null;
  const changePct = (last && prev && prev.weight) ? +((last.weight-prev.weight)/prev.weight*100).toFixed(1) : null;
  const range = p.weightRange || {min:null,max:null};
  const outOfRange = last && range.min!=null && (last.weight<range.min || last.weight>range.max);

  return `
  <div class="section-head"><h2>Отслеживание веса</h2><button class="btn btn-sm btn-primary" data-quick="weight" data-pet="${p.id}">${icon('plus')} Новое измерение</button></div>

  ${outOfRange?`<div class="warn-banner">${icon('bell')}<div>Текущий вес (${last.weight} кг) выходит за установленный диапазон ${range.min}–${range.max} кг.</div></div>`:''}
  ${(change!==null && Math.abs(changePct)>=8)?`<div class="warn-banner">${icon('bell')}<div>Вес изменился на ${Math.abs(changePct)}% с последнего измерения — обратите внимание на динамику.</div></div>`:''}

  <div class="grid grid-2">
    <div class="card">
      <div class="card-title"><h3>Текущий вес</h3>
        <button class="btn btn-sm" data-set-range="${p.id}">${icon('scale')} Целевой диапазон</button>
      </div>
      <div class="stat-big">${last?last.weight:p.weight||'—'} кг</div>
      ${change!==null?`<div class="stat-label" style="margin-top:4px;">${change>0?'+':''}${change} кг (${changePct>0?'+':''}${changePct}%) с прошлого измерения</div>`:''}
      ${range.min!=null?`<div class="row-sub" style="margin-top:8px;">Оптимальный диапазон: <span class="mono">${range.min}–${range.max} кг</span></div>`:''}
      <div class="section-head" style="margin-top:16px;"><h3 style="font-size:13px;">Периоды</h3></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;" id="weightPeriodBar">
        ${['1м','3м','6м','1г','всё'].map((l,i)=>`<button class="btn btn-sm ${i===4?'btn-primary':''}" data-weight-period="${l}" data-pet-w="${p.id}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Динамика</h3></div>
      ${weightDynamicsHTML(logs)}
    </div>
  </div>

  <div class="section-block" style="margin-top:16px;">
    <div class="card">
      <div class="card-title"><h3>График изменения веса</h3></div>
      <canvas id="weightChart" height="90"></canvas>
    </div>
  </div>

  <div class="section-block">
    <div class="card">
      <div class="card-title"><h3>История измерений</h3></div>
      ${logs.length? logs.slice().reverse().map(w=>`<div class="list-row">
        <span class="dot dot-moss"></span>
        <div class="row-main"><div class="row-title mono">${w.weight} кг</div><div class="row-sub">${fmtDate(w.date)}${w.comment?' · '+w.comment:''}</div></div>
        <button class="icon-btn" data-edit-weight="${w.id}">${icon('edit')}</button>
        <button class="icon-btn" data-del-weight="${w.id}">${icon('trash')}</button>
      </div>`).join('') : `<div class="empty-note">Измерений пока нет.</div>`}
    </div>
  </div>
  `;
}
function weightDynamicsHTML(logs){
  if(logs.length<2) return `<div class="empty-note">Недостаточно данных для анализа динамики.</div>`;
  const weights = logs.map(l=>l.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const avg = +(weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(2);
  const last30 = logs.filter(l=> daysBetween(l.date, todayISO())<=30);
  let dyn30 = '';
  if(last30.length>=2){
    const d = +(last30[last30.length-1].weight-last30[0].weight).toFixed(2);
    dyn30 = `Вес ${d>=0?'увеличился':'снизился'} на ${Math.abs(d)} кг за последние 30 дней.`;
  }
  return `
  <div class="two-col-stats">
    <div><div class="stat-label">Минимум</div><div class="mono">${min} кг</div></div>
    <div><div class="stat-label">Максимум</div><div class="mono">${max} кг</div></div>
    <div><div class="stat-label">Среднее</div><div class="mono">${avg} кг</div></div>
    <div><div class="stat-label">Измерений</div><div class="mono">${logs.length}</div></div>
  </div>
  ${dyn30?`<div class="row-sub" style="margin-top:10px;">${dyn30}</div>`:''}
  <div class="row-sub" style="margin-top:4px;color:var(--ink-soft);font-style:italic;">Это инструмент отслеживания динамики, не медицинский диагноз.</div>
  `;
}
let weightChartInstance=null;
function drawWeightChart(petId, period='всё'){
  const canvas = document.getElementById('weightChart');
  if(!canvas || typeof Chart==='undefined') return;
  let logs = state.weightLogs.filter(w=>w.petId===petId).sort((a,b)=>a.date.localeCompare(b.date));
  const days = {'1м':30,'3м':90,'6м':180,'1г':365,'всё':100000}[period]||100000;
  const cutoff = addDays(todayISO(), -days);
  logs = logs.filter(l=>l.date>=cutoff);
  if(weightChartInstance) weightChartInstance.destroy();
  weightChartInstance = new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels:logs.map(l=>fmtDate(l.date)), datasets:[{
      label:'Вес (кг)', data:logs.map(l=>l.weight),
      borderColor:'#4B6B4A', backgroundColor:'rgba(75,107,74,0.12)', fill:true, tension:.3,
      pointBackgroundColor:'#4B6B4A', pointRadius:4, pointHoverRadius:6
    }]},
    options:{
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> ctx.parsed.y+' кг'}}},
      scales:{y:{ticks:{font:{family:'IBM Plex Mono'}}}, x:{ticks:{font:{family:'IBM Plex Mono'},maxRotation:0}}}
    }
  });
}

/* ============ CALENDAR ============ */
let calCursor = new Date();
function renderCalendar(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // Monday first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const monthEvents = {};
  state.events.forEach(e=>{
    if(!monthEvents[e.date]) monthEvents[e.date]=[];
    monthEvents[e.date].push(e);
  });
  state.healthEvents.forEach(h=>{ if(h.nextDate){ if(!monthEvents[h.nextDate]) monthEvents[h.nextDate]=[]; monthEvents[h.nextDate].push({title:h.title,type:h.type,petId:h.petId}); }});
  state.vetVisits.forEach(v=>{ if(!monthEvents[v.date]) monthEvents[v.date]=[]; monthEvents[v.date].push({title:'Визит: '+(petById(v.petId)?.name||''),type:'ветеринар',petId:v.petId}); });
  activePets().forEach(p=>{
    if(!p.dob) return;
    const bd = new Date(p.dob+'T00:00:00');
    if(isNaN(bd) || bd.getMonth()!==m) return;
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(bd.getDate()).padStart(2,'0')}`;
    if(!monthEvents[iso]) monthEvents[iso]=[];
    monthEvents[iso].push({title:'🎂 День рождения — '+p.name, type:'день_рождения', petId:p.id});
  });

  const monthLabel = calCursor.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  return `
  <div class="topbar">
    <div><div class="page-title">Календарь</div><div class="page-sub">Все события, связанные с животными, включая дни рождения</div></div>
    <button class="btn btn-primary" data-quick="calevent">${icon('plus')} Добавить событие</button>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <button class="btn btn-sm" id="calPrev">←</button>
      <h3 style="text-transform:capitalize;">${monthLabel}</h3>
      <button class="btn btn-sm" id="calNext">→</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return `<div class="cal-day other"></div>`;
        const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const evs = monthEvents[iso]||[];
        const isToday = iso===todayISO();
        return `<div class="cal-day ${isToday?'today':''}" data-cal-day="${iso}">
          <div class="num">${d}</div>
          ${evs.slice(0,2).map(e=>`<div class="cal-evt" style="background:${typeColor(e.type)}22;color:${typeColor(e.type)};">${e.title.split(' — ')[0]}</div>`).join('')}
          ${evs.length>2?`<div class="row-sub">+${evs.length-2} ещё</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>
  ${modalHost()}
  `;
}
function typeColor(t){
  return {'обработка':'#B5592E','вакцинация':'#4B6B4A','ветеринар':'#3E6B7C','день_рождения':'#7A5AA8','другое':'#B9872B'}[t]||'#B9872B';
}

let catChartInst=null, petChartInst=null;
function drawExpenseCharts(){
  const byCat={}; state.expenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+Number(e.amount));
  const byPet={}; state.expenses.forEach(e=>{ const n=petById(e.petId)?.name||'Общее'; byPet[n]=(byPet[n]||0)+Number(e.amount);});
  const palette=['#4B6B4A','#B5592E','#B9872B','#3E6B7C','#A5433A','#6E8F6D','#C98B5C'];

function bindModalFieldEvents(){
  const cancel = document.getElementById('cancelBtn'); if(cancel) cancel.onclick = closeModal;
  const archiveBtn = document.getElementById('archivePetBtn');
  if(archiveBtn) archiveBtn.onclick = ()=>{
    const id = archiveBtn.dataset.archiveId;
    if(id && !state.archive.includes(id)){
      state.archive.push(id);
      scheduleSave();
      toast('Животное отправлено в архив');
      closeModal();
      nav('pets');
    }
  };
  const sexSelect = document.getElementById('petSexSelect');
  if(sexSelect) sexSelect.onchange = ()=>{
    const male = sexSelect.value==='Самец';
    const label = document.getElementById('neuterLabel');
    const sel = document.getElementById('neuterSelect');
    if(label) label.textContent = male?'Кастрация':'Стерилизация';
    if(sel) sel.innerHTML = (male?[['нет','Не кастрирован'],['да','Кастрирован'],['неизвестно','Неизвестно']]:[['нет','Не стерилизована'],['да','Стерилизована'],['неизвестно','Неизвестно']]).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  };
  const photoInput = document.getElementById('petPhotoInput');
  if(photoInput) photoInput.onchange = async ()=>{
    const f = photoInput.files[0];
    if(!f) return;
    try{
      const dataUrl = await resizeImageFile(f);
      const preview = document.getElementById('petPhotoPreview');
      if(preview){ preview.src = dataUrl; preview.style.display='block'; }
      photoInput.dataset.resized = dataUrl;
    }catch(err){ console.error(err); toast('Не удалось загрузить фото'); }
  };
  const form = document.getElementById('mform');
  if(form) form.onsubmit = handleModalSubmit;
}

/* ============ SUBMIT HANDLERS ============ */
let modalCtx = {};
async function handleModalSubmit(e){
  e.preventDefault();
  const formEl = e.target;
  const fd = new FormData(formEl);
  const data = Object.fromEntries(fd.entries());
  const kind = modalCtx.kind;

  if(kind==='pet'){
    const photoInput = document.getElementById('petPhotoInput');
    const newPhoto = photoInput && photoInput.dataset.resized ? photoInput.dataset.resized : null;
    if(modalCtx.pet){
      Object.assign(modalCtx.pet, data);
      modalCtx.pet.weight = parseFloat(data.weight)||modalCtx.pet.weight;
      if(newPhoto) modalCtx.pet.photo = newPhoto;
      toast('Животное обновлено');
    } else {
      state.pets.push({id:uid(), ...data, weight:parseFloat(data.weight)||0, weightRange:{}, photo:newPhoto||'', createdAt:todayISO()});
      toast('Животное добавлено');
    }
  }
  else if(kind==='expense'){
    pushToArrayRef(expensesRef, {petId:data.petId, date:data.date||todayISO(), amount:parseFloat(data.amount), cat:data.category, comment:data.comment||'', pay:data.pay||'cash'})
      .then(()=>toast('Расход добавлен в бюджет'))
      .catch(()=>toast('Не удалось сохранить расход'));
    closeModal(); return;
  }
  else if(kind==='health' || kind==='treatment' || kind==='vaccination'){
    const validDays = parseInt(data.validDays)||null;
    const nextDate = validDays ? addDays(data.date, validDays) : null;
    state.healthEvents.push({id:uid(), petId:data.petId, type:data.type, subtype:data.subtype||'', group:data.group||'', brand:data.brand||'', title:data.title, date:data.date, validDays, nextDate, comment:data.comment||'', vet:data.vet||''});
    toast('Запись добавлена');
  }
  else if(kind==='vet'){
    const status = data.status || (data.date < todayISO() ? 'состоялся' : 'запланирован');
    if(data.id){
      const v = state.vetVisits.find(x=>x.id===data.id);
      if(v) Object.assign(v, {date:data.date, clinic:data.clinic, reason:data.reason, diagnosis:data.diagnosis, recommendations:data.recommendations, cost:parseFloat(data.cost)||0, status});
      toast('Визит обновлён');
    } else {
      state.vetVisits.push({id:uid(), petId:data.petId, date:data.date, clinic:data.clinic, reason:data.reason, diagnosis:data.diagnosis, recommendations:data.recommendations, cost:parseFloat(data.cost)||0, status});
      toast('Визит добавлен');
    }
  }
  else if(kind==='document'){
    state.documents.push({id:uid(), petId:data.petId, name:data.name, type:data.type, date:data.date, note:data.note||''});
    toast('Документ добавлен');
  }
  else if(kind==='weight'){
    if(data.id){
      const w = state.weightLogs.find(x=>x.id===data.id);
      Object.assign(w, {date:data.date, weight:parseFloat(data.weight), comment:data.comment});
    } else {
      state.weightLogs.push({id:uid(), petId:data.petId, date:data.date, weight:parseFloat(data.weight), comment:data.comment||''});
      const p = petById(data.petId); if(p) p.weight = parseFloat(data.weight);
    }
    toast('Измерение сохранено');
  }
  else if(kind==='range'){
    const p = petById(modalCtx.petId);
    p.weightRange = {min:parseFloat(data.min)||null, max:parseFloat(data.max)||null};
    toast('Диапазон сохранён');
  }
  else if(kind==='calevent'){
    state.events.push({id:uid(), petId:data.petId||null, title:data.title, date:data.date, type:data.type, description:data.description||'', repeatEveryDays:parseInt(data.repeatEveryDays)||null, done:false});
    toast('Событие добавлено');
  }
  else if(kind==='supply'){
    state.supplies.push({id:uid(), name:data.name, petId:data.petId, currentStock:parseFloat(data.currentStock), unit:data.unit, avgConsumption:parseFloat(data.avgConsumption), lastPurchaseDate:todayISO(), lastPurchaseQty:parseFloat(data.currentStock), lastPurchaseCost:parseFloat(data.lastPurchaseCost)||0, history:[]});
    toast('Товар добавлен');
  }
  else if(kind==='restock'){
    const s = state.supplies.find(x=>x.id===modalCtx.supplyId);
    s.currentStock += parseFloat(data.qty);
    s.lastPurchaseDate = todayISO(); s.lastPurchaseQty = parseFloat(data.qty); s.lastPurchaseCost = parseFloat(data.cost)||0;
    s.history = s.history||[]; s.history.push({date:todayISO(), qty:parseFloat(data.qty), cost:parseFloat(data.cost)||0});
    toast('Запас пополнен');
  }
  else if(kind==='savingsGoal'){
    pushToArrayRef(fundsRef, {name:data.name, totalCost:data.totalCost?parseFloat(data.totalCost):0, currentSaved:parseFloat(data.current)||0, monthlyAmount:parseFloat(data.monthly)||0, cycleDays:parseInt(data.cycleDays)||30, emoji:data.emoji||'🐾', color:'#4B6B4A', lastPurchaseDate:todayISO(), linkedPlanId:null, purchaseHistory:[]})
      .then(()=>toast('Копилка создана в общем бюджете'))
      .catch(()=>toast('Не удалось создать копилку'));
    closeModal(); return;
  }
  else if(kind==='fund'){
    const s = state.savings.find(x=>x.id===modalCtx.savingId);
    if(s){
      const amount = parseFloat(data.amount)||0;
      const newHistory = [...(s.history||[]), {date:todayISO(), amount, note:data.note||''}];
      updateArrayItem(fundsRef, s.id, {currentSaved:(s.current||0)+amount, purchaseHistory:newHistory})
        .then(()=>toast('Копилка пополнена'))
        .catch(()=>toast('Не удалось пополнить копилку'));
    }
    closeModal(); return;
  }
  else if(kind==='reminderSettings'){
    state.reminderSettings.offsets = data.offsets.split(',').map(x=>parseInt(x.trim())).filter(Boolean).sort((a,b)=>b-a);
    toast('Сроки обновлены');
  }

  scheduleSave();
  closeModal();
}

/* ============ QUICK ACTION / DELEGATED EVENTS ============ */
document.addEventListener('click', (e)=>{
  const q = e.target.closest('[data-quick]');
  if(q){
    const kind = q.dataset.quick;
    const petId = q.dataset.pet || (route.tab==='pet'?route.petId:activePets()[0]?.id);
    modalCtx = {kind: kind==='calevent'?'calevent':kind};
    if(kind==='pet') openModal(modalPetForm());
    else if(kind==='expense') openModal(modalExpenseForm(petId));
    else if(kind==='treatment') openModal(modalHealthForm(petId,'treatment'));
    else if(kind==='vaccination') openModal(modalHealthForm(petId,'vaccination'));
    else if(kind==='health') openModal(modalHealthForm(petId,'health'));
    else if(kind==='vet') openModal(modalVetForm(petId));
    else if(kind==='document') openModal(modalDocForm(petId));
    else if(kind==='weight') openModal(modalWeightForm(petId));
    else if(kind==='calevent') openModal(modalCalEventForm());
    else if(kind==='supply') openModal(modalSupplyForm());
    else if(kind==='savingsGoal') openModal(modalSavingsForm());
    else if(kind==='reminderSettings') openModal(modalReminderSettingsForm());
    return;
  }
  const editPet = e.target.closest('[data-edit-pet]');
  if(editPet){ modalCtx={kind:'pet', pet:petById(editPet.dataset.editPet)}; openModal(modalPetForm(modalCtx.pet)); return; }

  const editW = e.target.closest('[data-edit-weight]');
  if(editW){ const w = state.weightLogs.find(x=>x.id===editW.dataset.editWeight); modalCtx={kind:'weight'}; openModal(modalWeightForm(w.petId, w)); return; }
  const delW = e.target.closest('[data-del-weight]');
  if(delW){ state.weightLogs = state.weightLogs.filter(x=>x.id!==delW.dataset.delWeight); scheduleSave(); render(); return; }

  const setRange = e.target.closest('[data-set-range]');
  if(setRange){ modalCtx={kind:'range', petId:setRange.dataset.setRange}; openModal(modalRangeForm(setRange.dataset.setRange)); return; }

  const delHealth = e.target.closest('[data-del-health]');
  if(delHealth){ state.healthEvents = state.healthEvents.filter(x=>x.id!==delHealth.dataset.delHealth); scheduleSave(); render(); return; }
  const skipHealth = e.target.closest('[data-skip-health]');
  if(skipHealth){
    const h = state.healthEvents.find(x=>x.id===skipHealth.dataset.skipHealth);
    if(h && h.nextDate){
      const skippedFrom = h.nextDate;
      h.nextDate = addDays(h.nextDate, h.validDays||30);
      h.comment = (h.comment?h.comment+'; ':'')+'пропущено: '+fmtDate(skippedFrom);
      scheduleSave(); render(); toast('Обработка пропущена — следующая дата перенесена');
    }
    return;
  }
  const delVet = e.target.closest('[data-del-vet]');
  if(delVet){ state.vetVisits = state.vetVisits.filter(x=>x.id!==delVet.dataset.delVet); scheduleSave(); render(); return; }
  const delDoc = e.target.closest('[data-del-doc]');
  if(delDoc){ state.documents = state.documents.filter(x=>x.id!==delDoc.dataset.delDoc); scheduleSave(); render(); return; }
  const delExpense = e.target.closest('[data-del-expense]');
  if(delExpense){ removeArrayItem(expensesRef, delExpense.dataset.delExpense).then(()=>toast('Расход удалён')); return; }
  const delSupply = e.target.closest('[data-del-supply]');
  if(delSupply){ state.supplies = state.supplies.filter(x=>x.id!==delSupply.dataset.delSupply); scheduleSave(); render(); return; }
  const delSaving = e.target.closest('[data-del-saving]');
  if(delSaving){ removeArrayItem(fundsRef, delSaving.dataset.delSaving).then(()=>toast('Копилка удалена')); return; }

  const restock = e.target.closest('[data-restock]');
  if(restock){ modalCtx={kind:'restock', supplyId:restock.dataset.restock}; openModal(modalRestockForm(restock.dataset.restock)); return; }
  const fund = e.target.closest('[data-fund]');
  if(fund){ modalCtx={kind:'fund', savingId:fund.dataset.fund}; openModal(modalFundForm(fund.dataset.fund)); return; }

  const doneEvt = e.target.closest('[data-done-event]');
  if(doneEvt){
    const ev = state.events.find(x=>x.id===doneEvt.dataset.doneEvent);
    if(ev){
      if(ev.repeatEveryDays){ ev.date = addDays(ev.date, ev.repeatEveryDays); }
      else { ev.done = true; }
      scheduleSave(); render(); toast('Отмечено выполненным');
    }
    return;
  }

  const petTabBtn = e.target.closest('[data-pet-tab]');
  if(petTabBtn){ route.petTab = petTabBtn.dataset.petTab; render(); return; }

  const printBtn = e.target.closest('[data-print-pet]');
  if(printBtn){ window.print(); return; }

  const unarchive = e.target.closest('[data-unarchive]');
  if(unarchive){ state.archive = state.archive.filter(id=>id!==unarchive.dataset.unarchive); scheduleSave(); render(); toast('Животное возвращено из архива'); return; }

  const deletePet = e.target.closest('[data-delete-pet]');
  if(deletePet){
    const id = deletePet.dataset.deletePet;
    if(confirm('Удалить это животное навсегда? Действие необратимо.')){
      state.pets = state.pets.filter(p=>p.id!==id);
      state.archive = state.archive.filter(x=>x!==id);
      state.weightLogs = state.weightLogs.filter(x=>x.petId!==id);
      state.healthEvents = state.healthEvents.filter(x=>x.petId!==id);
      state.vetVisits = state.vetVisits.filter(x=>x.petId!==id);
      state.documents = state.documents.filter(x=>x.petId!==id);
      state.events = state.events.filter(x=>x.petId!==id);
      scheduleSave(); render(); toast('Животное удалено');
    }
    return;
  }

  const calDay = e.target.closest('[data-cal-day]');
  if(calDay){ modalCtx={kind:'calevent'}; const iso=calDay.dataset.calDay; openModal(modalCalEventForm(iso)); return; }

  const calPrev = e.target.closest('#calPrev');
  if(calPrev){ calCursor.setMonth(calCursor.getMonth()-1); render(); return; }
  const calNext = e.target.closest('#calNext');
  if(calNext){ calCursor.setMonth(calCursor.getMonth()+1); render(); return; }

  const wPeriod = e.target.closest('[data-weight-period]');
  if(wPeriod){ document.querySelectorAll('[data-weight-period]').forEach(b=>b.classList.remove('btn-primary')); wPeriod.classList.add('btn-primary'); drawWeightChart(wPeriod.dataset.petW, wPeriod.dataset.weightPeriod); return; }

  const exportCsv = e.target.closest('#exportCsv');
  if(exportCsv){ downloadExpensesCsv(); return; }
  const backupBtn = e.target.closest('#backupBtn');
  if(backupBtn){ downloadBackup(); return; }
});

function downloadExpensesCsv(){
  const rows = [['Дата','Животное','Категория','Сумма','Комментарий']];
  state.expenses.forEach(e=> rows.push([e.date, petById(e.petId)?.name||'', e.category, e.amount, e.comment||'']));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pet-expenses.csv'; a.click();
}
function downloadBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pet-dashboard-backup.json'; a.click();
}

/* ============ SEARCH ============ */
function renderSearchResults(q){
  // simple: not a separate page, just could filter dashboard in future. For now no-op placeholder.
}

/* ============ AFTER RENDER: draw charts if needed ============ */
const _origRender = render;
render = function(){
  _origRender();
  if(route.tab==='pet' && route.petTab==='weight'){ setTimeout(()=>drawWeightChart(route.petId,'всё'),0); }
  if(route.tab==='expenses'){ setTimeout(drawExpenseCharts,0); }
};

/* ============ INIT ============ */
(async function init(){
  await loadState();
  render();
})();
</script>
