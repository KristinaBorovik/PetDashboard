<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Полевой журнал — Pet Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#F2EEE3; --paper-2:#EAE4D4; --card:#FCFAF3; --ink:#22301F; --ink-soft:#5B6B54;
  --line:#DAD3BE; --moss:#4B6B4A; --moss-dark:#374F37; --moss-tint:#E4EBDF;
  --clay:#B5592E; --clay-tint:#F5E4D9; --gold:#B9872B; --gold-tint:#F3E7C9;
  --sky:#3E6B7C; --sky-tint:#DEE9EC; --red:#A5433A; --red-tint:#F4DEDA;
  --purple:#7A5AA8; --purple-tint:#E9E2F3; --radius:14px; --radius-sm:99px;
  --shadow:0 1px 2px rgba(34,48,31,0.06), 0 6px 20px -8px rgba(34,48,31,0.15);
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D2C9AC;border-radius:6px;}

#app{display:flex;min-height:100vh;}
.sidebar{width:216px;flex-shrink:0;background:var(--paper-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px 8px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--moss);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:17px;height:17px;stroke:var(--paper);}
.brand-text{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;line-height:1.15;}
.brand-text small{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-soft);font-weight:500;font-size:13.5px;border:none;background:transparent;text-align:left;width:100%;transition:background .12s, color .12s;}
.nav-item svg{width:16px;height:16px;stroke:currentColor;flex-shrink:0;}
.nav-item:hover{background:#E1DBC6;color:var(--ink);}
.nav-item.active{background:var(--moss);color:#fff;}
.nav-item .badge{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}

.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;}
.page-title{font-size:26px;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;}
.btn:hover{border-color:var(--moss);}
.btn svg{width:14px;height:14px;stroke:currentColor;}
.btn-primary{background:var(--moss);border-color:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-dark);}
.btn-sm{padding:6px 10px;font-size:12px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-moss{background:var(--moss);} .dot-clay{background:var(--clay);} .dot-sky{background:var(--sky);}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:13.5px;}
.row-sub{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.row-right{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-family:'IBM Plex Mono';margin-right:6px;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill-clay{background:var(--clay-tint);color:var(--clay);}
.pill-moss{background:var(--moss-tint);color:var(--moss-dark);}
.pill-purple{background:var(--purple-tint);color:var(--purple);}
.pill-sky{background:var(--sky-tint);color:var(--sky);}

.icon-btn{background:none;border:none;padding:5px;border-radius:6px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--paper-2);color:var(--ink);}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;}
.icon-btn.complete-btn{color:var(--moss);}
.icon-btn.complete-btn:hover{background:var(--moss-tint);color:var(--moss-dark);}

.overlay{position:fixed;inset:0;background:rgba(34,48,31,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;padding:22px 24px 24px;box-shadow:0 20px 60px -12px rgba(0,0,0,.35);position:relative;}
.modal h3{font-size:17px;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);outline:none;}
.field-row{display:flex;gap:10px;} .field-row>*{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.empty-note{color:var(--ink-soft);font-size:13px;padding:12px 2px;}
.action-card-option{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s, background .15s;}
.action-card-option:hover{border-color:var(--moss);background:#fff;}
.action-card-option h4{font-size:14px;margin-bottom:3px;color:var(--moss-dark);}
.action-card-option p{margin:0;font-size:12px;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  paw:'<circle cx="5" cy="6" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="13" cy="6" r="1.6"/><path d="M9 9c-3 0-5 2.4-4.6 4.7.3 1.7 1.9 2.6 3.2 1.9.9-.5 1.7-.5 2.6 0 1.3.7 3-.2 3.2-1.9C13.9 11.4 12 9 9 9Z"/>',
  plus:'<path d="M10 4v12M4 10h12"/>',
  edit:'<path d="M13 3l4 4-9 9-4.5 1 1-4.5L13 3Z"/>',
  trash:'<path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/>',
  syringe:'<path d="M13 3l4 4-2 2-4-4 2-2Z"/><path d="M13.5 5.5 6 13v3H3v-3l7.5-7.5"/><path d="M9 9l2 2M7 11l2 2"/>',
  drop:'<path d="M10 3s5 5.8 5 9.2A5 5 0 1 1 5 12.2C5 8.8 10 3 10 3Z"/>',
  check:'<path d="M4 10.5l4 4 8-9"/>'
};
function icon(name){ return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

/* STATE & FIREBASE MOCK / INITIALIZATION */
let state = {
  pets: [{id:'p1', name:'Шиба', species:'Собака'}],
  healthEvents: [
    {id:'h1', petId:'p1', type:'вакцинация', group:'бешенство', title:'Рабизин', date:'2025-08-14', validDays:365, nextDate:'2026-08-14', status:'active', comment:''},
    {id:'h2', petId:'p1', type:'обработка', subtype:'от блох и клещей', title:'Симпарика', brand:'Zoetis', date:'2026-05-14', validDays:90, nextDate:'2026-08-12', status:'active', comment:''}
  ]
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate() + Number(n)); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}); }

let route = { tab: 'vaccinations' };
let currentModal = null;

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand"><div class="brand-mark">${icon('paw')}</div><div class="brand-text">Полевой журнал<small>Pet Dashboard</small></div></div>
      <button class="nav-item ${route.tab==='vaccinations'?'active':''}" onclick="route.tab='vaccinations';render();">${icon('syringe')}<span>Прививки</span></button>
      <button class="nav-item ${route.tab==='treatments'?'active':''}" onclick="route.tab='treatments';render();">${icon('drop')}<span>Обработки</span></button>
    </div>
    <div class="main">
      ${route.tab==='vaccinations' ? renderVaccinationsPage() : renderTreatmentsPage()}
    </div>
    ${currentModal ? currentModal() : ''}
  `;
}

/* VACCINATIONS PAGE */
function renderVaccinationsPage(){
  const list = state.healthEvents.filter(h => h.type === 'вакцинация');
  const activeList = list.filter(h => h.status !== 'archived').sort((a,b) => (a.nextDate||'').localeCompare(b.nextDate||''));
  const historyList = list.filter(h => h.status === 'archived').sort((a,b) => (b.date||'').localeCompare(a.date||''));

  return `
  <div class="topbar">
    <div><div class="page-title">Прививки</div><div class="page-sub">Управление вакцинацией и история</div></div>
    <button class="btn btn-primary" onclick="openHealthModal(null, 'vaccination')">${icon('plus')} Добавить прививку</button>
  </div>
  <div class="card">
    <h3 style="font-size:15px; margin-bottom:12px;">Активные прививки</h3>
    ${activeList.length ? activeList.map(h => vaccinationRow(h)).join('') : `<div class="empty-note">Активных прививок не найдено.</div>`}
  </div>
  ${historyList.length ? `
  <div class="card" style="margin-top:20px; opacity:0.85;">
    <h3 style="font-size:15px; margin-bottom:12px; color:var(--ink-soft);">История сделанных прививок</h3>
    ${historyList.map(h => vaccinationRow(h, true)).join('')}
  </div>` : ''}
  `;
}

function vaccinationRow(h, isHistory = false){
  const pet = state.pets.find(p => p.id === h.petId);
  const overdue = !isHistory && h.nextDate && h.nextDate < todayISO();
  return `
  <div class="list-row">
    <span class="dot ${isHistory ? 'dot-sky' : 'dot-moss'}"></span>
    <div class="row-main">
      <div class="row-title">
        ${h.title} ${h.group ? `<span class="pill pill-purple">${h.group}</span>` : ''}
        ${pet ? `<span class="pill pill-moss">${pet.name}</span>` : ''}
        ${isHistory ? `<span class="pill pill-sky">Архив/Сделано</span>` : ''}
      </div>
      <div class="row-sub">Сделано: ${fmtDate(h.date)}${h.vet ? ' · ' + h.vet : ''}${h.comment ? ' · ' + h.comment : ''}</div>
    </div>
    <div class="row-right" style="${overdue ? 'color:var(--red);font-weight:600;' : ''}">
      ${isHistory ? '' : 'Следующая: ' + fmtDate(h.nextDate)}
    </div>
    ${!isHistory ? `
      <button class="icon-btn complete-btn" onclick="openCompleteDialog('${h.id}')" title="Отметить сделанной">${icon('check')}</button>
    ` : ''}
    <button class="icon-btn" onclick="openHealthModal('${h.id}', 'vaccination')" title="Редактировать">${icon('edit')}</button>
    <button class="icon-btn" onclick="deleteHealth('${h.id}')" title="Удалить">${icon('trash')}</button>
  </div>`;
}

/* TREATMENTS PAGE */
function renderTreatmentsPage(){
  const list = state.healthEvents.filter(h => h.type === 'обработка');
  const activeList = list.filter(h => h.status !== 'archived').sort((a,b) => (a.nextDate||'').localeCompare(b.nextDate||''));
  const historyList = list.filter(h => h.status === 'archived').sort((a,b) => (b.date||'').localeCompare(a.date||''));

  return `
  <div class="topbar">
    <div><div class="page-title">Обработки от паразитов</div><div class="page-sub">Блохи, клещи, глисты и т.д.</div></div>
    <button class="btn btn-primary" onclick="openHealthModal(null, 'treatment')">${icon('plus')} Добавить обработку</button>
  </div>
  <div class="card">
    <h3 style="font-size:15px; margin-bottom:12px;">Активные обработки</h3>
    ${activeList.length ? activeList.map(h => treatmentRow(h)).join('') : `<div class="empty-note">Активных обработок не найдено.</div>`}
  </div>
  ${historyList.length ? `
  <div class="card" style="margin-top:20px; opacity:0.85;">
    <h3 style="font-size:15px; margin-bottom:12px; color:var(--ink-soft);">История обработок</h3>
    ${historyList.map(h => treatmentRow(h, true)).join('')}
  </div>` : ''}
  `;
}

function treatmentRow(h, isHistory = false){
  const pet = state.pets.find(p => p.id === h.petId);
  const overdue = !isHistory && h.nextDate && h.nextDate < todayISO();
  return `
  <div class="list-row">
    <span class="dot ${isHistory ? 'dot-sky' : 'dot-clay'}"></span>
    <div class="row-main">
      <div class="row-title">
        ${h.title || 'Обработка'} <span class="pill pill-clay">${h.subtype || 'обработка'}</span>
        ${pet ? `<span class="pill pill-moss">${pet.name}</span>` : ''}
        ${isHistory ? `<span class="pill pill-sky">Архив/Сделано</span>` : ''}
      </div>
      <div class="row-sub">Сделано: ${fmtDate(h.date)} · Срок: ${h.validDays || 30} дн.${h.brand ? ' · ' + h.brand : ''}${h.comment ? ' · ' + h.comment : ''}</div>
    </div>
    <div class="row-right" style="${overdue ? 'color:var(--red);font-weight:600;' : ''}">
      ${isHistory ? '' : 'Следующая: ' + fmtDate(h.nextDate)}
    </div>
    ${!isHistory ? `
      <button class="icon-btn complete-btn" onclick="openCompleteDialog('${h.id}')" title="Отметить сделанной">${icon('check')}</button>
    ` : ''}
    <button class="icon-btn" onclick="openHealthModal('${h.id}', 'treatment')" title="Редактировать">${icon('edit')}</button>
    <button class="icon-btn" onclick="deleteHealth('${h.id}')" title="Удалить">${icon('trash')}</button>
  </div>`;
}

/* DIALOG: COMPLETE ACTION (Сделано -> Продлить ИЛИ Новый препарат) */
function openCompleteDialog(id){
  const item = state.healthEvents.find(h => h.id === id);
  if(!item) return;

  currentModal = () => `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>Отметить выполнение: ${item.title}</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:-10px; margin-bottom:16px;">
        Выберите, как поступить с повторной обработкой/прививкой:
      </p>

      <div class="action-card-option" onclick="processCompleteOption('${id}', 'extend')">
        <h4>1. Продлить этим же препаратом («${item.title}»)</h4>
        <p>Текущая запись отправится в историю с сегодняшней датой, а для «${item.title}» отсчитается новый срок (+${item.validDays||30} дней).</p>
      </div>

      <div class="action-card-option" onclick="processCompleteOption('${id}', 'new')">
        <h4>2. Сделать другой препарат / изменить параметры</h4>
        <p>Запись «${item.title}» закроется в историю, и сразу откроется форма для ввода нового названия и срока.</p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">Отмена</button>
      </div>
    </div>
  </div>`;
  render();
}

function processCompleteOption(id, choice){
  const item = state.healthEvents.find(h => h.id === id);
  if(!item) return;

  const today = todayISO();

  // Archive existing record as history log
  item.status = 'archived';

  if(choice === 'extend'){
    // Create new cycle with exact same params
    const newNextDate = addDays(today, item.validDays || 30);
    state.healthEvents.push({
      ...item,
      id: uid(),
      date: today,
      nextDate: newNextDate,
      status: 'active'
    });
    closeModal();
  } else if(choice === 'new'){
    closeModal();
    // Open creation modal populated with base pet info, but clear title
    openHealthModal(null, item.type, {
      petId: item.petId,
      group: item.group,
      subtype: item.subtype,
      validDays: item.validDays
    });
  }
}

/* MODAL: ADD / EDIT HEALTH RECORD */
function openHealthModal(id = null, defaultType = 'vaccination', initialData = {}){
  const editing = id ? state.healthEvents.find(h => h.id === id) : null;
  const item = editing || {
    id: null,
    petId: initialData.petId || (state.pets[0] ? state.pets[0].id : ''),
    type: defaultType,
    subtype: initialData.subtype || 'от блох и клещей',
    group: initialData.group || 'комплексная (кошки)',
    title: '',
    brand: '',
    date: todayISO(),
    validDays: defaultType === 'vaccination' ? 365 : 30,
    vet: '',
    comment: ''
  };

  currentModal = () => `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${editing ? 'Редактировать' : 'Добавить'}: ${item.type === 'treatment' ? 'Обработку' : 'Прививку'}</h3>
      <form id="healthForm" onsubmit="saveHealthForm(event, '${item.id || ''}', '${item.type}')">
        <div class="field">
          <label>Животное</label>
          <select name="petId">
            ${state.pets.map(p => `<option value="${p.id}" ${item.petId === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
          </select>
        </div>

        ${item.type === 'treatment' ? `
          <div class="field">
            <label>Тип паразитов</label>
            <select name="subtype">
              ${['от блох','от клещей','от блох и клещей','от глистов','от москитов','другое'].map(t => `<option ${item.subtype===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        ` : `
          <div class="field">
            <label>Группа / от чего прививка</label>
            <select name="group">
              ${['бешенство','комплексная (кошки)','комплексная (собаки)','лишай','лептоспироз','другое'].map(g => `<option ${item.group===g?'selected':''}>${g}</option>`).join('')}
            </select>
          </div>
        `}

        <div class="field">
          <label>Название препарата</label>
          <input name="title" value="${item.title || ''}" placeholder="Например: Бравекто, Симпарика, Нобивак" required>
        </div>

        ${item.type === 'treatment' ? `
          <div class="field">
            <label>Производитель / бренд</label>
            <input name="brand" value="${item.brand || ''}" placeholder="Zoetis, Bayer и т.д.">
          </div>
        ` : ''}

        <div class="field-row">
          <div class="field">
            <label>Дата проведения</label>
            <input type="date" name="date" value="${item.date || todayISO()}" required>
          </div>
          <div class="field">
            <label>Срок действия (дней)</label>
            <input type="number" name="validDays" value="${item.validDays || (item.type==='vaccination'?365:30)}" required>
          </div>
        </div>

        ${item.type === 'vaccination' ? `
          <div class="field">
            <label>Ветеринар / клиника</label>
            <input name="vet" value="${item.vet || ''}">
          </div>
        ` : ''}

        <div class="field">
          <label>Заметка / комментарий</label>
          <textarea name="comment" rows="2">${item.comment || ''}</textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal()">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>`;
  render();
}

function saveHealthForm(e, id, type){
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);

  const dateVal = formData.get('date');
  const validDaysVal = Number(formData.get('validDays')) || 30;
  const nextDateVal = addDays(dateVal, validDaysVal);

  if(id){
    // Update existing record
    const item = state.healthEvents.find(h => h.id === id);
    if(item){
      item.petId = formData.get('petId');
      item.title = formData.get('title');
      item.date = dateVal;
      item.validDays = validDaysVal;
      item.nextDate = nextDateVal;
      item.comment = formData.get('comment');
      if(type === 'treatment'){
        item.subtype = formData.get('subtype');
        item.brand = formData.get('brand');
      } else {
        item.group = formData.get('group');
        item.vet = formData.get('vet');
      }
    }
  } else {
    // Create new record
    const newItem = {
      id: uid(),
      petId: formData.get('petId'),
      type: type,
      title: formData.get('title'),
      date: dateVal,
      validDays: validDaysVal,
      nextDate: nextDateVal,
      status: 'active',
      comment: formData.get('comment')
    };
    if(type === 'treatment'){
      newItem.subtype = formData.get('subtype');
      newItem.brand = formData.get('brand');
    } else {
      newItem.group = formData.get('group');
      newItem.vet = formData.get('vet');
    }
    state.healthEvents.push(newItem);
  }

  closeModal();
}

function deleteHealth(id){
  if(confirm('Удалить эту запись?')){
    state.healthEvents = state.healthEvents.filter(h => h.id !== id);
    render();
  }
}

function closeModal(){
  currentModal = null;
  render();
}

// Initial render
render();
</script>

</html>
